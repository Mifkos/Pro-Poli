<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2a1f55">
  <title>Pro Poli</title>
  <meta name="description" content="Malá výroční pixelová hra pro Poli.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="app" class="game" aria-live="polite">
    <div class="game__sky" aria-hidden="true">
      <span class="star star--1"></span><span class="star star--2"></span><span class="star star--3"></span>
      <span class="star star--4"></span><span class="star star--5"></span><span class="star star--6"></span>
      <div class="moon"></div>
      <div class="cloud cloud--1"></div><div class="cloud cloud--2"></div><div class="cloud cloud--3"></div>
      <div class="hills hills--back"></div><div class="hills hills--front"></div>
    </div>

    <section class="screen is-active" data-screen="intro">
      <div class="scene-card intro-card">
        <div class="pixel-frame pixel-frame--wide">
          <div class="characters" aria-label="Pixelové postavičky Martina a Poli">
            <div class="sprite-wrap sprite-wrap--boy" aria-hidden="true">
              <svg class="sprite" viewBox="0 0 96 144" role="img">
                <g shape-rendering="crispEdges">
                  <rect x="28" y="10" width="40" height="12" fill="#a97448"/>
                  <rect x="22" y="20" width="52" height="14" fill="#b68153"/>
                  <rect x="18" y="32" width="60" height="18" fill="#b68153"/>
                  <rect x="24" y="46" width="48" height="34" fill="#f1c6a2"/>
                  <rect x="17" y="38" width="10" height="30" fill="#a97448"/>
                  <rect x="69" y="38" width="10" height="30" fill="#a97448"/>
                  <rect x="28" y="54" width="16" height="12" fill="#2b2324"/>
                  <rect x="52" y="54" width="16" height="12" fill="#2b2324"/>
                  <rect x="32" y="57" width="8" height="6" fill="#f7dfc7"/>
                  <rect x="56" y="57" width="8" height="6" fill="#f7dfc7"/>
                  <rect x="44" y="58" width="8" height="4" fill="#2b2324"/>
                  <rect x="42" y="71" width="12" height="4" fill="#9f5b61"/>
                  <rect x="30" y="80" width="36" height="46" fill="#ece8dc"/>
                  <rect x="30" y="86" width="36" height="7" fill="#3a466d"/>
                  <rect x="30" y="100" width="36" height="7" fill="#3a466d"/>
                  <rect x="30" y="114" width="36" height="7" fill="#3a466d"/>
                  <rect x="18" y="84" width="12" height="35" fill="#f1c6a2"/>
                  <rect x="66" y="84" width="12" height="35" fill="#f1c6a2"/>
                  <rect x="34" y="126" width="12" height="14" fill="#2f3547"/>
                  <rect x="50" y="126" width="12" height="14" fill="#2f3547"/>
                  <rect x="31" y="138" width="17" height="5" fill="#17171d"/>
                  <rect x="48" y="138" width="17" height="5" fill="#17171d"/>
                </g>
              </svg>
              <span class="name-tag">Martin</span>
            </div>

            <div class="heart-pixel" aria-hidden="true"><span></span></div>

            <div class="sprite-wrap sprite-wrap--girl" aria-hidden="true">
              <svg class="sprite" viewBox="0 0 96 144" role="img">
                <g shape-rendering="crispEdges">
                  <rect x="22" y="10" width="52" height="16" fill="#14131a"/>
                  <rect x="16" y="24" width="64" height="22" fill="#14131a"/>
                  <rect x="14" y="42" width="16" height="56" fill="#14131a"/>
                  <rect x="66" y="42" width="16" height="56" fill="#14131a"/>
                  <rect x="27" y="36" width="42" height="42" fill="#efc3a4"/>
                  <rect x="27" y="31" width="42" height="12" fill="#14131a"/>
                  <rect x="33" y="31" width="6" height="18" fill="#14131a"/>
                  <rect x="45" y="31" width="6" height="18" fill="#14131a"/>
                  <rect x="57" y="31" width="6" height="18" fill="#14131a"/>
                  <rect x="35" y="55" width="6" height="6" fill="#20202b"/>
                  <rect x="55" y="55" width="6" height="6" fill="#20202b"/>
                  <rect x="42" y="68" width="12" height="4" fill="#9b535f"/>
                  <rect x="28" y="78" width="40" height="48" fill="#14131a"/>
                  <rect x="20" y="82" width="10" height="37" fill="#efc3a4"/>
                  <rect x="66" y="82" width="10" height="37" fill="#efc3a4"/>
                  <rect x="34" y="126" width="10" height="13" fill="#17171d"/>
                  <rect x="52" y="126" width="10" height="13" fill="#17171d"/>
                  <rect x="31" y="138" width="16" height="5" fill="#0d0d10"/>
                  <rect x="49" y="138" width="16" height="5" fill="#0d0d10"/>
                </g>
              </svg>
              <span class="name-tag">Poli</span>
            </div>
          </div>
        </div>

        <div class="speech-card">
          <span class="speech-card__tiny">malá výroční hra</span>
          <h1>Pro Poli</h1>
          <p>Některá data nejsou jen čísla. Některá otevřou celý malý svět.</p>
          <button class="pixel-button" data-go="password">Začít</button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="password">
      <div class="scene-card password-card">
        <div class="mini-characters" aria-hidden="true">
          <span class="mini-boy">⌐◨</span><span class="mini-heart">♥</span><span class="mini-girl">●</span>
        </div>
        <div class="panel panel--pink">
          <span class="panel__label">Zadej naše datum</span>
          <h2>Heslo</h2>
          <div class="pin" data-pin aria-label="Čtyřmístné heslo">
            <span>•</span><span>•</span><span>•</span><span>•</span>
          </div>
          <div class="keypad" aria-label="Číselná klávesnice">
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
            <button class="keypad__clear" data-clear>×</button><button data-key="0">0</button><button class="keypad__ok" data-submit>♥</button>
          </div>
          <p class="feedback" data-feedback></p>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="gifts">
      <div class="scene-card gifts-card">
        <div class="headline-bubble">
          <span>Vyber si jeden dárek, Poli</span>
          <small>Všechny tři něco tají.</small>
        </div>
        <div class="gifts" data-gifts>
          <button class="gift gift--one" data-gift="1" aria-label="Otevřít první dárek">
            <span class="gift__lid"></span><span class="gift__box"></span><span class="gift__ribbon"></span><span class="gift__bow">♥</span>
          </button>
          <button class="gift gift--two" data-gift="2" aria-label="Otevřít druhý dárek">
            <span class="gift__lid"></span><span class="gift__box"></span><span class="gift__ribbon"></span><span class="gift__bow">♥</span>
          </button>
          <button class="gift gift--three" data-gift="3" aria-label="Otevřít třetí dárek">
            <span class="gift__lid"></span><span class="gift__box"></span><span class="gift__ribbon"></span><span class="gift__bow">♥</span>
          </button>
        </div>
        <p class="gift-hint">Klikni na jeden z nich.</p>
      </div>
    </section>

    <section class="screen" data-screen="letter">
      <div class="scene-card letter-scene">
        <div class="envelope is-closed" data-envelope aria-hidden="true">
          <div class="envelope__back"></div>
          <div class="envelope__paper"></div>
          <div class="envelope__front"></div>
          <div class="envelope__flap"></div>
          <div class="envelope__seal">P</div>
        </div>

        <article class="letter" data-letter hidden>
          <div class="letter__texture"></div>
          <p class="letter__kicker">A letter for you</p>
          <h2>Milá Poli,</h2>
          <div class="letter__body" data-letter-body></div>
          <p class="letter__signature" data-signature></p>
          <button class="pixel-button pixel-button--dark" data-restart>Začít znovu</button>
        </article>
      </div>
    </section>

    <button class="sound-toggle" type="button" data-sound aria-label="Zapnout nebo vypnout zvuk" aria-pressed="false">♫</button>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
